[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "market-state-explorer"
version = "1.2.0"
description = "Production web research for interpretable crypto market states with near-real-time relay and readable visual state views"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0,<3",
    "pandas>=2.2,<3",
    "plotly>=5.24,<7",
    "requests>=2.32,<3",
    "streamlit>=1.40,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
