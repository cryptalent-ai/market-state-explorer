name: Binance Cloud Probe

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Confirm REST restriction and archive availability
        shell: bash
        run: |
          set -u
          code=$(curl -sS -o /tmp/rest.txt -w '%{http_code}' --max-time 20 'https://fapi.binance.com/fapi/v1/klines?symbol=BTCUSDT&interval=5m&limit=2' || true)
          echo "fapi HTTP $code"
          cat /tmp/rest.txt || true
          archive=$(curl -L -sS -o /tmp/archive.zip -w '%{http_code}' --max-time 20 'https://data.binance.vision/data/futures/um/daily/klines/BTCUSDT/5m/BTCUSDT-5m-2026-08-31.zip' || true)
          echo "archive HTTP $archive bytes=$(wc -c </tmp/archive.zip)"
          test "$archive" = "200"
      - name: Exercise Market State Explorer hosted fallback
        run: |
          python - <<'PY'
          from pathlib import Path
          from tempfile import TemporaryDirectory
          from src.live_data import build_recent_market_data

          with TemporaryDirectory() as tmp:
              market, metadata = build_recent_market_data(cache_root=Path(tmp))
              print(metadata.as_dict())
              print(market.frame.tail(3)[['timestamp','close','oi']])
              assert 'delayed hosted fallback' in metadata.source
              assert metadata.rows >= 1000
              assert metadata.future_oi_matches == 0
              assert metadata.oi_coverage > 0.99
          PY
