name: Binance Cloud Probe

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe Binance USD-M public endpoints and archive
        shell: bash
        run: |
          set -u
          probe() {
            name="$1"
            url="$2"
            code=$(curl -L -sS -o /tmp/body.bin -w '%{http_code}' --max-time 20 "$url" || true)
            size=$(wc -c </tmp/body.bin 2>/dev/null || echo 0)
            echo "===== $name HTTP $code bytes=$size ====="
            if [ "$size" -lt 800 ]; then
              head -c 700 /tmp/body.bin || true
              echo
            fi
          }
          probe fapi 'https://fapi.binance.com/fapi/v1/klines?symbol=BTCUSDT&interval=5m&limit=2'
          probe fapi1 'https://fapi1.binance.com/fapi/v1/klines?symbol=BTCUSDT&interval=5m&limit=2'
          probe fapi2 'https://fapi2.binance.com/fapi/v1/klines?symbol=BTCUSDT&interval=5m&limit=2'
          probe fapi3 'https://fapi3.binance.com/fapi/v1/klines?symbol=BTCUSDT&interval=5m&limit=2'
          probe fapi4 'https://fapi4.binance.com/fapi/v1/klines?symbol=BTCUSDT&interval=5m&limit=2'
          probe oi 'https://fapi.binance.com/futures/data/openInterestHist?symbol=BTCUSDT&period=5m&limit=2'
          probe archive_kline 'https://data.binance.vision/data/futures/um/daily/klines/BTCUSDT/5m/BTCUSDT-5m-2026-08-31.zip'
          probe archive_oi 'https://data.binance.vision/data/futures/um/daily/metrics/BTCUSDT/BTCUSDT-metrics-2026-08-31.zip'
