name: CI

on:
  push:
    branches: [main, v1.3-decision-ui, v1.3.1-relay-freshness-hotfix, v1.3.2-windows-silent-relay, v1.3.3-remove-state-paths]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'
      - name: Compile
        run: python -m compileall app.py scripts src tests
      - name: Test
        run: pytest
